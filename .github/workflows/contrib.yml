name: Update contribution cards

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate SVGs
        env:
          GITHUB_LOGIN: karlmoriaty
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-contrib.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-heatmap-light.svg assets/contrib-heatmap-dark.svg assets/contrib-radar-light.svg assets/contrib-radar-dark.svg
          git diff --cached --quiet || git commit -m "chore: update contribution cards"
          git push